# Récupère les données et publie le site sur GitHub Pages.
# Toutes les heures : projets, setups et actu. Toutes les 15 minutes entre les deux : l'actu seulement.
# Sur une autre branche que la branche par défaut : tests + récupération des données seulement (pas de publication).
name: Données et site

on:
  push:
  schedule:
    - cron: '17 * * * *'
    - cron: '2,32,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PUBLISH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      NEWS_ONLY: ${{ github.event.schedule == '2,32,47 * * * *' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        if: env.NEWS_ONLY != 'true'
        run: npm test

      - name: Configurer GitHub Pages
        id: pages
        if: env.PUBLISH == 'true'
        uses: actions/configure-pages@v5

      - name: Récupérer les données déjà en ligne
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p previous
          for f in projects market setups news; do
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/$f.json" -o "previous/$f.json" || echo "Pas encore de $f.json en ligne."
          done

      # Chaque étape peut échouer sans bloquer les autres : la version déjà en ligne est alors republiée.
      - name: Actu
        id: news
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/build-news.mjs --out _site/data --previous previous/news.json --projects previous/projects.json

      - name: Projets
        id: projects
        if: env.NEWS_ONLY != 'true'
        continue-on-error: true
        timeout-minutes: 18
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/build-data.mjs --out _site/data --previous previous/projects.json

      - name: Setups
        id: setups
        if: env.NEWS_ONLY != 'true'
        continue-on-error: true
        timeout-minutes: 12
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/build-setups.mjs --out _site/data --previous previous/setups.json

      - name: Compléter avec la version déjà en ligne
        run: |
          mkdir -p _site/data
          for f in projects market setups news; do
            if [ ! -s "_site/data/$f.json" ] && [ -s "previous/$f.json" ]; then
              cp "previous/$f.json" "_site/data/$f.json"
              echo "$f.json : version déjà en ligne conservée."
            fi
          done
          if [ "${{ steps.news.outcome }}" = failure ]; then echo "::warning::Actu non mise à jour à ce passage."; fi
          if [ "${{ steps.projects.outcome }}" = failure ]; then echo "::warning::Projets non mis à jour à ce passage."; fi
          if [ "${{ steps.setups.outcome }}" = failure ]; then echo "::warning::Setups non mis à jour à ce passage."; fi

      # Alertes Discord : nouveaux setups confirmés et news critiques, comparés à la version déjà en ligne.
      - name: Alertes Discord
        if: env.PUBLISH == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/send-alerts.mjs --data _site/data --previous previous --site "${{ steps.pages.outputs.base_url }}"

      - name: Assembler le site
        run: cp -r index.html css js mockup _site/

      - uses: actions/upload-pages-artifact@v3
        if: env.PUBLISH == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
