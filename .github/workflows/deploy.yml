# Récupère les données et publie le site sur GitHub Pages.
# Toutes les heures : projets, setups et actu. Toutes les 15 minutes entre les deux : l'actu seulement.
# Sur une autre branche que la branche par défaut : tests + récupération des données seulement (pas de publication).
# GitHub lance les tâches planifiées quand il veut (parfois des heures de retard) : un minuteur externe gratuit
# (cron-job.org) peut appeler workflow_dispatch avec actu=true toutes les 5 minutes pour une actu vraiment fraîche.
name: Données et site

on:
  push:
  schedule:
    - cron: '17 * * * *'
    - cron: '2,32,47 * * * *'
  workflow_dispatch:
    inputs:
      actu:
        description: 'Actu seulement (rapide)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PUBLISH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      NEWS_ONLY: ${{ github.event.schedule == '2,32,47 * * * *' || inputs.actu == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        if: env.NEWS_ONLY != 'true'
        run: npm test

      - name: Configurer GitHub Pages
        id: pages
        if: env.PUBLISH == 'true'
        uses: actions/configure-pages@v5

      - name: Récupérer les données déjà en ligne
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p previous
          for f in projects market setups news alerts marche outils; do
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/$f.json" -o "previous/$f.json" || echo "Pas encore de $f.json en ligne."
          done
          # Fiches paire déjà en ligne (onglet Setups) : reprises si les setups échouent à ce passage.
          mkdir -p previous/paire
          for s in BTC ETH SOL BZ; do
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/paire/$s.json" -o "previous/paire/$s.json" || echo "Pas encore de paire/$s.json en ligne."
          done
          # Fiches crypto déjà en ligne : celles des cryptos du tableau de l'onglet Marché.
          mkdir -p previous/crypto
          for id in $(jq -r '.top[]?.id // empty' previous/marche.json 2>/dev/null); do
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/crypto/$id.json" -o "previous/crypto/$id.json" || echo "Pas encore de fiche $id en ligne."
          done

      # Chaque étape peut échouer sans bloquer les autres : la version déjà en ligne est alors republiée.
      - name: Actu
        id: news
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/build-news.mjs --out _site/data --previous previous/news.json --projects previous/projects.json

      - name: Projets
        id: projects
        if: env.NEWS_ONLY != 'true'
        continue-on-error: true
        timeout-minutes: 18
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/build-data.mjs --out _site/data --previous previous/projects.json

      - name: Setups
        id: setups
        if: env.NEWS_ONLY != 'true'
        continue-on-error: true
        timeout-minutes: 12
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/build-setups.mjs --out _site/data --previous previous/setups.json

      - name: Marché
        id: marche
        if: env.NEWS_ONLY != 'true'
        continue-on-error: true
        timeout-minutes: 6
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/build-marche.mjs --out _site/data --previous previous/marche.json

      - name: Outils
        id: outils
        if: env.NEWS_ONLY != 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/build-outils.mjs --out _site/data --previous previous/outils.json
      # Une fiche par crypto du tableau de l'onglet Marché (#crypto/<id>) : bougies, levier OKX, chiffres clés.
      - name: Fiches crypto
        id: cryptos
        if: env.NEWS_ONLY != 'true'
        continue-on-error: true
        timeout-minutes: 9
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node scripts/build-cryptos.mjs --out _site/data --marche _site/data/marche.json,previous/marche.json --previous previous/crypto

      - name: Compléter avec la version déjà en ligne
        run: |
          mkdir -p _site/data
          for f in projects market setups news marche outils; do
            if [ ! -s "_site/data/$f.json" ] && [ -s "previous/$f.json" ]; then
              cp "previous/$f.json" "_site/data/$f.json"
              echo "$f.json : version déjà en ligne conservée."
            fi
          done
          if [ "${{ steps.news.outcome }}" = failure ]; then echo "::warning::Actu non mise à jour à ce passage."; fi
          if [ "${{ steps.projects.outcome }}" = failure ]; then echo "::warning::Projets non mis à jour à ce passage."; fi
          if [ "${{ steps.setups.outcome }}" = failure ]; then echo "::warning::Setups non mis à jour à ce passage."; fi
          if [ "${{ steps.marche.outcome }}" = failure ]; then echo "::warning::Marché non mis à jour à ce passage."; fi
          if [ "${{ steps.outils.outcome }}" = failure ]; then echo "::warning::Outils non mis à jour à ce passage."; fi
          mkdir -p _site/data/crypto
          for p in previous/crypto/*.json; do
            [ -s "$p" ] || continue
            f="_site/data/crypto/$(basename "$p")"
            [ -s "$f" ] || cp "$p" "$f"
          done
          mkdir -p _site/data/paire
          for p in previous/paire/*.json; do
            [ -s "$p" ] || continue
            f="_site/data/paire/$(basename "$p")"
            [ -s "$f" ] || cp "$p" "$f"
          done
          if [ "${{ steps.cryptos.outcome }}" = failure ]; then echo "::warning::Fiches crypto non mises à jour à ce passage."; fi

      # Alertes Discord : nouveaux setups confirmés et news critiques, comparés à la version déjà en ligne.
      # Au premier passage avec le lien, un message de bienvenue ; data/alerts.json retient qu'il est parti.
      # Chaque matin après 7 h (Paris), un résumé : setups en cours, news du jour, situation géopolitique.
      - name: Alertes Discord
        if: env.PUBLISH == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/send-alerts.mjs --data _site/data --previous previous --site "${{ steps.pages.outputs.base_url }}"

      # Sur une autre branche : aperçu du résumé du matin dans le journal, rien n'est envoyé.
      - name: Aperçu du résumé Discord
        if: env.PUBLISH != 'true'
        continue-on-error: true
        run: node scripts/send-alerts.mjs --data _site/data --previous previous --dry-run --digest-now | tail -1 | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{for(const e of JSON.parse(s)){console.log('## '+e.title);for(const f of e.fields||[])console.log('-- '+f.name+'\\n'+f.value);if(e.description)console.log(e.description)}})"

      # Sur une autre branche : données des fiches paire en fin de journal, pour construire un aperçu.
      - name: Données des fiches paire
        if: env.PUBLISH != 'true'
        continue-on-error: true
        run: cat paire-gz.txt

      # Numéro de version dans les liens vers les scripts et le style : après une mise à jour, le navigateur
      # ne mélange pas la nouvelle page avec les anciens scripts gardés en cache (10 minutes sur GitHub Pages).
      - name: Assembler le site
        run: |
          cp -r index.html css js mockup _site/
          v="${GITHUB_SHA::8}"
          sed -i -E "s#\"(css/style\.css|js/app\.js)\"#\"\1?v=$v\"#g" _site/index.html
          sed -i -E "s#^(import .*'\./[a-z0-9-]+\.js)';#\1?v=$v';#" _site/js/*.js
          grep -q "js/app.js?v=$v" _site/index.html
          echo "Version des scripts : $v ($(grep -l "?v=$v" _site/js/*.js | wc -l) fichiers JS)"

      - uses: actions/upload-pages-artifact@v3
        if: env.PUBLISH == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
