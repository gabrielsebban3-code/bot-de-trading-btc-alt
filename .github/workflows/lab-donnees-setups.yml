# Temporaire : labo 9, les nouvelles données du marché (open interest, gros traders, funding, peur et avidité,
# volatilité des options, profil de volume, saisonnalité) aident-elles les signaux Setups ? Ne publie rien. À supprimer avant fusion.
name: Lab donnees Setups
on:
  push:
    branches: [claude/project-thread-9hb3zq]
    paths: ['scripts/lab/**', '.github/workflows/lab-donnees-setups.yml']
  workflow_dispatch:
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bougies, funding et métriques Binance (data.binance.vision)
        run: |
          mkdir -p lab-data lab-zip
          PAIRS="BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT BNBUSDT LINKUSDT AVAXUSDT ADAUSDT"
          for s in $PAIRS; do for y in 2020 2021 2022 2023 2024 2025 2026; do for m in 01 02 03 04 05 06 07 08 09 10 11 12; do
            [ "$y$m" -gt 202611 ] && continue
            for tf in 1h 1d; do echo "https://data.binance.vision/data/futures/um/monthly/klines/$s/$tf/$s-$tf-$y-$m.zip"; done
            echo "https://data.binance.vision/data/futures/um/monthly/fundingRate/$s/$s-fundingRate-$y-$m.zip"
          done; done; done > urls.txt
          # Métriques (open interest, ratios gros traders / foule, acheteurs pressés) : un fichier par jour.
          start=$(date -u -d 2021-06-01 +%s); end=$(date -u +%s)
          for s in $PAIRS; do t=$start; while [ $t -lt $end ]; do d=$(date -u -d @$t +%F); echo "https://data.binance.vision/data/futures/um/daily/metrics/$s/$s-metrics-$d.zip"; t=$((t+86400)); done; done >> urls.txt
          wc -l urls.txt
          xargs -P 48 -n 1 sh -c 'curl -sf --retry 3 -o "lab-zip/$(basename "$0")" "$0" || true' < urls.txt
          ls lab-zip | wc -l; ls lab-zip | grep -c metrics || true
          for z in lab-zip/*.zip; do unzip -oq "$z" -d lab-data || echo "zip KO $z"; done
          ls lab-data | wc -l
      - name: Peur et avidité, volatilité des options (Deribit DVOL)
        run: |
          curl -sf --retry 3 "https://api.alternative.me/fng/?limit=0&format=json" -o lab-data/fng.json || echo "fng KO"
          for c in BTC ETH; do for y in 2021 2022 2023 2024 2025 2026; do
            a=$(date -u -d "$y-01-01" +%s)000; b=$(date -u -d "$((y+1))-01-01" +%s)000
            curl -sf --retry 3 "https://www.deribit.com/api/v2/public/get_volatility_index_data?currency=$c&start_timestamp=$a&end_timestamp=$b&resolution=1D" -o lab-data/dvol-$c-$y.json || echo "dvol KO $c $y"
          done; done
          ls -la lab-data/fng.json lab-data/dvol-* | head -20
      - name: Labo 9
        run: node scripts/lab/lab9.mjs lab-data
