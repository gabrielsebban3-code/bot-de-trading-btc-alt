name: Lab données swing
on:
  push:
    branches: [claude/swing-lab-data]
    paths: [lab/fetch.mjs, .github/workflows/lab.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node lab/fetch.mjs
      - run: |
          git config user.name lab && git config user.email lab@users.noreply.github.com
          git add lab/data && git commit -m "Données lab" && git push
