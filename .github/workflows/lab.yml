name: Lab données swing
on:
  push:
    branches: [claude/swing-lab-data]
    paths: [.github/workflows/lab.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://gabrielsebban3-code.github.io/bot-de-trading-btc-alt
          curl -sSI "$B/data/setups.json" | grep -iE "last-modified|cache-control|age:|date:"
          curl -sS "$B/data/setups.json" | jq -c '{generatedAt, assets: [.assets[].symbol], detectors, n: (.history|length), syms: ([.history[].symbol]|unique), live: (.live|length), stats: .stats.swing.winRate}'
          curl -sS "$B/js/setups.js" | head -3
          curl -sSI "$B/js/setups.js" | grep -iE "last-modified|cache-control"
