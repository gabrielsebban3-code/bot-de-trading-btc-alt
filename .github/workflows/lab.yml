name: Lab données swing
on:
  push:
    branches: [claude/swing-lab-data]
    paths: [.github/workflows/lab.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://gabrielsebban3-code.github.io/bot-de-trading-btc-alt
          curl -sS "$B/data/setups.json" > s.json
          jq -c 'del(.history) | del(.assets)' s.json | head -c 4000; echo
          jq -c '.history | sort_by(.time) | .[-15:][] | {symbol, dir, t: (.time/1000|todate), outcome, r}' s.json
