# Dinexo bot - every parameter lives here (rule 4). Secrets (Discord webhook) live in .env, never here.
# Phase 1 sections: data, universe, holdout, final_test, costs, risk, indicators, structure, engine, stats.
# Concept sections (C1..C5) are added by the pre-registered protocol of each phase, before any computation.

seed: 42

paths:
  market_db: bot/var/market.sqlite      # candles, funding, open interest, catalogue (gitignored)
  state_db: bot/var/state.sqlite        # signals, statuses, trials counter (gitignored)
  reports: bot/reports

# ---------------------------------------------------------------- data (Step 1)
data:
  archive_base: "https://data.binance.vision/data/futures/um"
  listing_base: "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"
  history_start: "2020-01-01"
  # Last month that may be read. Everything from final_test.start on is locked (option A, see PROTOCOLE.md).
  last_month: "2026-10"
  long_tf: "15m"                 # stored for the whole history, resampled to 1h / 4h / 1d / 1w
  fine_tf: "1m"                  # stored for the last `fine_months` months only (entry refinement, cost study)
  fine_months: 12
  native_check_tfs: ["1h", "4h", "1d"]   # native archives used to check the resampler
  download_workers: 16
  http_timeout_s: 60
  http_retries: 4
  verify_checksum: true
  quote_asset: "USDT"
  # Bases that are not crypto assets with a market of their own (stablecoins, indices).
  stablecoin_bases: [USDC, BUSD, TUSD, FDUSD, USDP, DAI, USDD, PYUSD, USD1, USDE, EUR, EURI, AEUR, UST, USTC,
                     SUSD, GUSD, LUSD, FRAX, XUSD, BFUSD, RLUSD]
  index_bases: [DEFI, ALL, FOOTBALL, BLUEBIRD]
  index_suffixes: [DOM]
  # Non-crypto USDT-M contracts listed since 2025 (stocks, ETFs, commodities, FX, pre-IPO). exchangeInfo
  # (underlyingType) is unreachable from the research server, so the list is explicit (DECISIONS.md D12).
  non_crypto_bases: [XAU, XAG, XAUT, PAXG, XPD, XPT, CL, BZ, NATGAS, COPPER, USDBRL,
    AAOI, AAPL, ABBV, ACN, ADBE, ALAB, AMAT, AMC, AMD, AMGN, AMZN, ANET, APLD, APP, ARM, ASML, ASTS, AVGO,
    BABA, BAC, BITO, BMNR, BRKB, BYD, CEG, CIEN, COHR, COIN, COST, CRCL, CRDO, CRM, CRWD, CRWV, CSCO,
    CSOPSAMSUNG2L, CSOPSKHYNIX2L, CVNA, CXMT, DDOG, DELL, DIS, DJT, DKNG, DRAM, EBAY, EWJ, EWT, EWY, EWZ, EWZS,
    GDX, GEV, GIGADEV, GLW, GME, GOOGL, GS, GTLB, HANMI, HIMS, HK0625, HK0700, HK0992, HK1810, HOOD, HPE, HUT,
    HYUNDAI, IBKR, IBM, INTC, IONQ, IREN, IWM, JPM, KLAC, KODEX200, KORU, KUAISHOU, LGELECTRONICS, LITE, LLY,
    LRCX, MARA, MCD, MDB, MEITUAN, MELI, META, MINIMAX, MRK, MRNA, MRVL, MSFT, MSTR, MSTU, MU, MUU, NAVER,
    NBIS, NFLX, NKE, NVDA, NVDL, NVO, OKLO, OPENAI, ANTHROPIC, ORCL, OXY, PANW, PDD, PFE, PLTR, POPMART, PYPL,
    QCOM, QQQ, RDDT, RIVN, RKLB, SAMSUNG, SAMSUNGEM, SHOP, SKHYNIX, SKHY, SMCI, SMH, SMR, SNDK, SNOW, SNPS,
    SNXX, SOFI, SONY, SOXL, SOXS, SPCX, SPY, SQQQ, TEM, TENCENT, TQQQ, TSLA, TSLL, TSM, TTWO, TXN, TZA, UBER,
    UNH, UNITREE, URNM, UVXY, VKTX, WDC, WMT, XBI, XLE, XOM, ZHIPU, TBT, TMF]

# ---------------------------------------------------------------- universe (Step 1)
universe:
  top_n: 30
  volume_window_days: 30         # trailing average daily quote volume, computed on closed daily candles
  min_avg_daily_quote_volume: 20000000.0   # 20 M USDT per day
  min_history_days: 30           # a pair needs this many daily candles before it can enter
  rebalance: "monthly"           # membership fixed for the calendar month, decided on the previous month's data

# ---------------------------------------------------------------- held-out pairs (PROTOCOLE.md, frozen 2026-11-17)
holdout:
  salt: "dinexo-holdout-2026-11-17"
  modulo: 3                      # sha256(salt:symbol) mod 3 == 0 -> held out
  never_holdout: [BTCUSDT, ETHUSDT]
  # The 40 pairs already used by perp-setups studies 1-8: never held out (they are not new data).
  already_used: [BTCUSDT, ETHUSDT, ZECUSDT, SOLUSDT, XRPUSDT, NEARUSDT, DOGEUSDT, BNBUSDT, 1000PEPEUSDT, ENAUSDT,
                 SUIUSDT, UNIUSDT, WLDUSDT, TRUMPUSDT, ADAUSDT, LINKUSDT, QNTUSDT, AVAXUSDT, TAOUSDT, ARBUSDT,
                 LSKUSDT, AAVEUSDT, FILUSDT, ONDOUSDT, BCHUSDT, LTCUSDT, STRKUSDT, BRUSDT, INJUSDT, PAXGUSDT,
                 PENGUUSDT, XLMUSDT, DASHUSDT, ONEUSDT, XMRUSDT, DOTUSDT, SANDUSDT, TIAUSDT, HBARUSDT, TRXUSDT]

# ---------------------------------------------------------------- final test lock (option A)
final_test:
  start: "2026-11-01"            # first instant never seen by any study
  unlocked: false                # only PROTOCOLE.md's final step may set this to true
  min_trades: 100
  min_months: 3

# ---------------------------------------------------------------- costs (Step 6), Binance grid checked 2026-11-17
costs:
  maker_fee: 0.0002              # 0.0200 % regular user, USDT-M
  taker_fee: 0.0005              # 0.0500 % regular user, USDT-M
  slippage:
    # adverse fraction on every market fill (entries, stops, time exits):
    # base + atr_coef * ATR(base tf)/price + impact_coef * daily_vol * sqrt(notional / avg daily quote volume)
    base: 0.0001
    atr_coef: 0.05
    impact_coef: 1.0
    atr_period: 14
    adv_days: 30
    vol_days: 30
  stress_multiplier: 1.5         # fees and slippage x1.5 robustness run

# ---------------------------------------------------------------- simulated risk (Step 8)
risk:
  initial_capital: 10000.0
  risk_per_trade: 0.01
  max_leverage: 5.0
  maintenance_margin_rate: 0.01
  max_positions: 5
  max_positions_per_pair: 1
  min_stop_pct: 0.003            # signal ignored if the stop is closer than 0.3 % of entry
  max_stop_pct: 0.30             # or farther than 30 % (0.06 until 2026-11-18, see DECISIONS.md D22)
  max_daily_loss_pct: 0.03       # no new entry for the rest of the UTC day once realised losses reach 3 %
  correlation:
    enabled: true
    window_days: 30              # daily returns, closed days only
    threshold: 0.7               # correlation with BTC above this -> group "btc_beta"
    max_same_direction: 3        # at most 3 positions in the same direction inside one group

# ---------------------------------------------------------------- engine (Step 6)
engine:
  path_tf: "15m"                 # intrabar path used for stops; "1m" where it exists and is requested
  warmup_days: 30                # no signal during the first 30 days of history or after a data gap
  stop_first_when_ambiguous: true
  limit_fill: "through"          # a limit order fills only when price trades through the level
  void_on_gap: true              # a trade that meets a data gap is cancelled (no invented prices)
  significant_stop_move_atr: 0.5 # live: a trailing move of at least 0.5 ATR triggers a "stop moved" alert

# ---------------------------------------------------------------- indicators
indicators:
  atr_period: 14
  rsi_period: 14
  adx_period: 14
  bb_period: 20
  bb_k: 2.0
  macd: [12, 26, 9]
  ema_periods: [20, 50, 200]
  rel_volume_window: 20
  vwap_anchor: "1d"              # session VWAP reset at 00:00 UTC

# ---------------------------------------------------------------- structure (Step 4)
structure:
  fractal_n: 3                   # pivot = extreme of 2n+1 candles, confirmed n candles later
  zigzag_atr_mult: 3.0           # reversal of 3 ATR from the running extreme confirms the extreme
  hierarchy:
    minor_n: 2
    intermediate_n: 2            # fractal of minor pivots (n on each side, among pivots of the same type)
    major_n: 2                   # fractal of intermediate pivots
  equal_level_tol: 0.0015        # equal highs/lows: within 0.15 %
  range:
    bb_width_window: 120         # compression = BB width in the lowest 20 % of the last 120 candles
    bb_width_pct: 0.20
    adx_max: 20

# ---------------------------------------------------------------- statistics (Step 7)
stats:
  bootstrap_resamples: 10000
  ci_level: 0.95
  spa_reps: 2000
  spa_block: 20                  # stationary bootstrap mean block length (days)
  inherited_trials: 682          # 232 from perp-setups studies 1-8 + 225 + 225 of phase 2 runs 1 and 2 (DECISIONS D22, D23)

# ---------------------------------------------------------------- concepts (Step 3), frozen in PROTOCOLE_PHASE2.md
concepts:
  common:
    min_signal_volume: 0.0          # signal candle volume must be strictly above this
  regime:
    context_tf: {"1h": "4h", "4h": "1d", "1d": "1d"}
    ema_fast: 50
    ema_slow: 200
    adx_period: 14
    adx_min: 20
    momentum_days: 60
  c1:
    donchian_ns: [20, 55, 100]
    ensemble_threshold: 0.6667      # at least 2 of the 3 channels in the direction
    volume_rel_min: 1.2
    volume_window: 20
    stop_atr: 2.5
    trail_chandelier_atr: 3.0
    trail_donchian_n: 20
  c2:
    trigger_tf: {"1h": "15m", "4h": "1h", "1d": "4h"}
    pullback_window: 5
    zone_atr: 0.5
    stop_buffer_atr: 0.5
    trail_chandelier_atr: 3.0
    hierarchical_level: "intermediate"
  c3:
    trend_ema: 200
    rsi_low: 10
    rsi_high: 90
    bb_period: 20
    bb_k: 2.0
    vwap_window: 20
    vwap_atr: 1.5
    stop_atr: 1.5
    max_hold_bars: 10
  c4:
    tf: "1h"
    oi_lookback_h: 24
    price_move: 0.03
    stop_atr: 2.0
    tp_r: 2.0
    max_hold_bars: 48
    filter_window_days: 30
    filter_z: 2.0
  c5:
    pivot_n: 3
    equal_tol: 0.0015
    equal_lookback: 100
    choch_window: 10
    zone_lookback: 3
    limit_validity_bars: 10
    stop_atr: 0.25
    divergence_rsi: 14
    climax_mult: 2.0
    htf_atr: 0.5
    fast_choch_bars: 3
    period_tf: {"1h": "1d", "4h": "1w"}
    weights: {sweep: 25, divergence: 20, climax: 15, htf_zone: 20, fast_choch: 20}

# ---------------------------------------------------------------- phase 2 grid (PROTOCOLE_PHASE2.md)
phase2:
  symbols: [BTCUSDT, ETHUSDT]
  tfs: ["1h", "4h", "1d"]
  directions: ["long", "short", "both"]
  c1_grid: {entry_n: ["20", "55", "100", "ensemble"], trail: ["chandelier", "donchian"]}
  c2_grid: {pullback: ["ema20", "ema50", "structure"], pivots: ["fractal", "zigzag", "hierarchical"]}

# ---------------------------------------------------------------- phase 3 grid (PROTOCOLE_PHASE3.md)
phase3:
  c3_grid: {tf: ["1h", "4h", "1d"], rsi_period: [2, 3, 5], deviation: ["bb", "vwap"]}
  c4_grid:
    funding: {signal: ["funding_abs", "funding_rel"], window_days: [7, 30], z: [2, 3]}
    oi: {signal: ["oi_purge"], oi_drop: [0.10, 0.15]}
  c5_grid: {tf: ["1h", "4h"], liquidity: ["equal", "period"], zone: ["fvg", "ob"], tp_r: [2, 3], min_score: [0, 60]}

walk_forward:
  start: "2022-01-01"
  end: "2026-11-01"
  train_months: 24
  test_months: 6
  min_train_trades: 10

robustness:
  param_shift: 0.20
  min_share_neighbors_positive: 0.75

baseline:
  pool_per_trade: 20
  pool_min: 2000
  draws: 1000
  percentile: 95

# ---------------------------------------------------------------- live detector (Phase 4, PROTOCOLE_PHASE4.md)
live:
  mode: "observation"            # observation: nothing is sent ; alerts: only variants with status "edge confirmé"
  market_db: bot/var/live.sqlite # forward data (final test), separate from the locked backtest database
  start: "2026-11-01"            # signals generated before this instant are never stored
  bootstrap_days: 430            # history needed by the indicators (EMA 200 daily + warm-up)
  observation_list: bot/reports/phase3/observation.json
  validated_list: bot/reports/validated.json
  scan_delay_s: 20               # websocket mode: scan this long after each 15m close
  universe_candidates: 80        # live universe: 30-day volume computed for the 80 largest 24h volumes
  monitor: {rolling_n: 50, dd_mult: 1.5}
  discord: {cooldown_hours: 12, min_score: 0, chart_candles: 120}
