{% extends "base.html" %}
{% block main %}
<h1>Réglages</h1>
{% if saved %}<p class="ok">Réglages enregistrés dans config.yaml.</p>{% endif %}
<form method="post" action="/settings" class="settings">
  <label>Requêtes de recherche (une par ligne)
    <textarea name="queries" rows="7">{{ cfg.search.queries|join('\n') }}</textarea></label>
  <div class="row">
    <label>Vidéos par exécution <input type="number" name="top_n" min="1" max="50" value="{{ cfg.search.top_n }}"></label>
    <label>Clips par vidéo <input type="number" name="clips_per_video" min="1" max="10" value="{{ cfg.moments.clips_per_video }}"></label>
    <label>Publiées depuis (jours) <input type="number" name="days" min="1" max="365" value="{{ cfg.search.days }}"></label>
    <label>Vues minimum <input type="number" name="min_views" min="0" value="{{ cfg.search.min_views }}"></label>
  </div>
  <label>Chaînes en liste blanche (une par ligne, prioritaires)
    <textarea name="whitelist" rows="3">{{ cfg.search.channel_whitelist|join('\n') }}</textarea></label>
  <label>Chaînes en liste noire (une par ligne, jamais traitées)
    <textarea name="blacklist" rows="3">{{ cfg.search.channel_blacklist|join('\n') }}</textarea></label>
  <label>Vitesse de traitement
    <select name="tmode">
      <option value="rapide" {% if cfg.transcription.mode == 'rapide' %}selected{% endif %}>Rapide (recommandé) : transcrit seulement autour des meilleurs moments</option>
      <option value="tres_rapide" {% if cfg.transcription.mode == 'tres_rapide' %}selected{% endif %}>Très rapide : idem, sous-titres un peu moins précis</option>
      <option value="complete" {% if cfg.transcription.mode == 'complete' %}selected{% endif %}>Complète : toute la vidéo, mots-clés utilisés pour choisir les moments (lent)</option>
    </select></label>
  <div class="row">
    <label>Cadrage
      <select name="layout">
        <option value="zoom" {% if cfg.render.layout == 'zoom' %}selected{% endif %}>Zoomé (carré, bandes noires)</option>
        <option value="noir" {% if cfg.render.layout == 'noir' %}selected{% endif %}>Large (16:9 sur fond noir)</option>
        <option value="flou" {% if cfg.render.layout == 'flou' %}selected{% endif %}>Large (16:9 sur fond flou)</option>
      </select></label>
    <label>Titre en haut du clip
      <select name="title">
        <option value="auto" {% if cfg.render.title == 'auto' %}selected{% endif %}>Automatique (phrase forte du passage)</option>
        <option value="video" {% if cfg.render.title == 'video' %}selected{% endif %}>Titre de la vidéo</option>
        <option value="none" {% if cfg.render.title == 'none' %}selected{% endif %}>Aucun</option>
      </select></label>
    <label>Style du titre
      <select name="title_style">
        <option value="encadre" {% if cfg.render.title_style == 'encadre' %}selected{% endif %}>Encadré blanc</option>
        <option value="texte" {% if cfg.render.title_style == 'texte' %}selected{% endif %}>Texte blanc avec ombre</option>
      </select></label>
    <label>Durée des clips
      <select name="duration">
        <option value="long" {% if duration == 'long' %}selected{% endif %}>1 minute et plus (60-90 s)</option>
        <option value="moyen" {% if duration == 'moyen' %}selected{% endif %}>Moyen (35-60 s)</option>
        <option value="court" {% if duration == 'court' %}selected{% endif %}>Court (20-45 s)</option>
        {% if duration == 'perso' %}<option value="perso" selected>Personnalisée (config.yaml)</option>{% endif %}
      </select></label>
  </div>
  <label class="check"><input type="checkbox" name="subtitles" {% if cfg.render.subtitles %}checked{% endif %}> Sous-titres incrustés</label>
  <label class="check"><input type="checkbox" name="highlight" {% if cfg.render.subtitle_highlight %}checked{% endif %}> Mot prononcé surligné en jaune</label>
  <label class="check"><input type="checkbox" name="uppercase" {% if cfg.render.subtitle_uppercase %}checked{% endif %}> Sous-titres en MAJUSCULES</label>
  <div class="row">
    <label>Supprimer les clips non favoris après (jours) <input type="number" name="max_age_days" min="1" value="{{ cfg.cleanup.max_age_days }}"></label>
    <label>Espace maximum (Go) <input type="number" name="max_total_gb" min="1" value="{{ cfg.cleanup.max_total_gb }}"></label>
  </div>
  <button class="primary">Enregistrer</button>
</form>
{% endblock %}
