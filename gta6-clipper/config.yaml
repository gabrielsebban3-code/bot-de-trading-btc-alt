# gta6-clipper : réglages. La page "Réglages" du site réécrit ce fichier (les commentaires sont alors perdus).
version: 2
search:
  queries:
    - GTA 6
    - GTA VI gameplay
    - GTA 6 trailer analyse
    - GTA 6 test
    - GTA 6 avis
    - GTA 6 map
  days: 7                 # publiées sur les N derniers jours
  min_duration_min: 3
  max_duration_min: 40
  min_views: 5000
  top_n: 5                # vidéos gardées par exécution
  results_per_query: 15
  max_candidates: 20      # extractions détaillées max (coûteuses) par exécution
  cache_hours: 6
  max_attempts: 3         # une vidéo en erreur est retentée jusqu'à 3 fois
  channel_whitelist: []   # prioritaires (bonus de score, ignorent min_views)
  channel_blacklist: []   # jamais traitées
moments:
  clips_per_video: 3
  min_clip_s: 60            # 1 minute minimum
  max_clip_s: 90
  target_clip_s: 70
  min_gap_s: 60
  margin_s: 0.5
  skip_intro_s: 60        # ignore l'intro et l'outro (vidéos de plus de 5 min)
  skip_outro_s: 45
  min_speech_ratio: 0.5        # un clip doit contenir de la parole au moins 50 % du temps
  min_video_speech_ratio: 0.15 # vidéo ignorée si on y parle moins de 15 % du temps
  weights:
    heatmap: 0.5
    audio: 0.25
    keywords: 0.25
    chat: 0.6             # rediffusions de lives : le chat qui s'emballe (« mdr », 😂, chat 5x plus rapide)
    comments: 0.4         # instants cités dans les commentaires (« 23:45 mdr »), quand il y en a
  keywords: [incroyable, regardez, regarde, énorme, enorme, confirmé, confirme, nouveau, nouvelle,
    map, carte, date de sortie, sortie, officiel, exclusif, fuite, leak, trailer, secret, dingue,
    fou, ouf, choquant, jamais vu, vice city, lucia, jason, prix, gameplay, attention, révélé, détail]
  llm:
    enabled: false        # envoie 2-3 passages présélectionnés à l'API Anthropic si activé
    model: claude-haiku-5-5
    weight: 0.3
transcription:
  model: small            # small ou medium
  language: fr
  compute_type: int8
  check_language: true
  mode: rapide            # complete | rapide (ne transcrit qu'autour des moments) | tres_rapide (+ beam 1)
  cpu_threads: 0          # 0 = tous les cœurs du processeur
render:
  layout: zoom              # zoom (carré, bandes noires) | noir (16:9 sur fond noir) | flou (16:9 sur fond flou)
  title: auto               # auto (phrase forte du passage) | video (titre de la vidéo) | none
  title_style: encadre      # encadre (boîte blanche) | texte (blanc avec ombre)
  subtitles: true
  subtitle_max_words: 3     # mots par bloc (une ligne)
  subtitle_highlight: true  # mot prononcé en jaune
  subtitle_uppercase: true
  jump_cuts: true           # coupe les blancs et les « euh » (montage dynamique)
  jump_cut_min_silence: 0.7 # silence minimum coupé, en secondes
  crf: 21
  preset: veryfast        # même qualité (CRF), encodage 2-3x plus rapide, fichiers un peu plus gros
  max_source_height: 1080
  font: DejaVu Sans
publish:
  hashtags: "#gta6 #gta6fr #gtavi #gta"   # ajoutés à la légende préparée pour TikTok
cleanup:
  enabled: true
  max_age_days: 30
  max_total_gb: 10
