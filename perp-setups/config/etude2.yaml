# Study 2 overlay (see PROTOCOLE_ETUDE_2.md). Replaces three blocks of config.yaml; everything else is unchanged.
# Only two things differ from study 1: risk_per_trade (0.005 instead of 0.01) and the grid (one configuration).
engine:
  initial_capital: 10000.0
  risk_per_trade: 0.005          # the single change of study 2
  max_leverage: 5.0
  max_positions: 5
  max_positions_per_pair: 1
  maintenance_margin_rate: 0.01
  min_stop_pct: 0.003
  max_stop_pct: 0.06
selection:
  dev_min_trades: 100
  dev_min_expectancy_r: 0.0
  dev_min_profit_factor: 1.0
  plateau_min_share: 0.0         # one configuration = no neighbour; its plateau was checked in study 1 (3/3 positive)
families:
  C:
    name: "Cassure de range (Donchian)"
    fixed:
      volume_mult: 1.5
      volume_window_bars: 20
      stop_atr_mult: 2.0
      trail_atr_mult: 3.0
    grid:
      timeframe: ["4h"]
      donchian_n: [55]
      volume_filter: ["on"]

# Final test opened on 2026-11-15 after Gabriel's explicit request ("Teste final"), step 1 having met the nine
# criteria on VAL. Only study 2 is unlocked: config.yaml keeps final_test_unlocked: false.
final_test_unlocked: true
