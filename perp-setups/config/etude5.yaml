# Study 5 overlay (see PROTOCOLE_ETUDE_5.md): a model scores the momentum 1h signals. Costs, engine, periods
# and criteria are those of study 4. Frozen before any computation.
final_test_unlocked: false
sets:
  dev:
    start: '2020-01-01'
    end: '2024-01-31'
  val:
    start: '2024-02-01'
    end: '2025-05-31'
  test:
    start: '2025-06-01'
    end: null
costs:
  maker_fee: 0.0005
  taker_fee: 0.0005
  slippage: 0.0002
  sensitivity_multiplier: 2.0
engine:
  initial_capital: 10000.0
  risk_per_trade: 0.01
  max_leverage: 5.0
  max_positions: 5
  max_positions_per_pair: 1
  maintenance_margin_rate: 0.01
  min_stop_pct: 0.003
  max_stop_pct: 1.0
families:
  M7:
    name: Momentum (pic de volume + cassure)
    fixed:
      sl_atr: 1.5
      volume_window: 20
      break_window: 3
    grid:
      timeframe:
      - 1h
      vol_mult:
      - 2
      tp_r:
      - 2.5
etude4:
  train_min_trades: 200
  criteria:
    min_trades: 200
    min_expectancy_r: 0.15
    min_profit_factor: 1.3
    max_drawdown_pct: 25.0
    min_share_pairs_positive: 0.6
    pair_min_trades: 10
    monte_carlo_resamples: 10000
    monte_carlo_min_positive: 0.95
    stability_shift: 0.2
  max_finalists: 3
  walk_forward:
  - start: '2022-02-01'
    end: '2022-09-30'
  - start: '2022-10-01'
    end: '2023-05-31'
  - start: '2023-06-01'
    end: '2024-01-31'
  - start: '2024-02-01'
    end: '2024-09-30'
  - start: '2024-10-01'
    end: '2025-05-31'
etude5:
  candidates: M7_tf1h_v2_tp2p5
  unfiltered_reference: M7_tf1h_v3_tp2p5
  model:
    max_depth: 3
    max_iter: 200
    learning_rate: 0.05
    min_samples_leaf: 200
    l2_regularization: 1.0
  retrain: monthly
  min_history_months: 12
  threshold_lookback_months: 6
  keep_quantiles:
  - 0.4
  - 0.6
  - 0.8
  first_trading_day: '2021-08-01'
  random_subsets: 1000
