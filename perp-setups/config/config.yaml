# All parameters of the study. Locked before any result was seen.
# Do NOT edit grids, costs or verdict thresholds after running a backtest.

seed: 42

# ---------------------------------------------------------------- data
data:
  start: "2020-01-01"            # earliest candle used
  warmup_days: 30                # no signal during the first 30 days of a pair's history
  base_interval: "15m"
  archive_base: "https://data.binance.vision/data/futures/um"
  api_base: "https://fapi.binance.com"
  # Last full month for which both klines and funding archives exist at download time.
  # fapi.binance.com answers HTTP 451 from the research server, so the current month
  # cannot be completed through the API (see DECISIONS.md).
  end_month: "2026-10"
  max_missing_pct: 1.0           # a pair with more missing candles is excluded
  big_move_pct: 30.0             # single-candle moves above this are listed (not removed)
  pair_selection:
    n_pairs: 20
    min_listing_months: 18
    volume_window_days: 90
    as_of: "2026-11-15"          # date of the selection ("today")
    stablecoin_bases: [USDC, BUSD, TUSD, FDUSD, USDP, DAI, USDD, PYUSD, USD1, USDE, EUR, EURI, AEUR, UST, USTC, SUSD, GUSD, LUSD, FRAX, XUSD, BFUSD, RLUSD]

# ---------------------------------------------------------------- sets
sets:
  dev:  {start: "2020-01-01", end: "2022-12-31"}
  val:  {start: "2023-01-01", end: "2024-12-31"}
  test: {start: "2025-01-01", end: null}     # null = end of data

# TEST set lock. Must stay false until Gabriel writes "go test final".
final_test_unlocked: false

# ---------------------------------------------------------------- costs
costs:
  maker_fee: 0.0002              # 0.02 % per side
  taker_fee: 0.0005              # 0.05 % per side
  slippage: 0.0003               # 0.03 % adverse per side on market orders and stops
  sensitivity_multiplier: 2.0    # fees and slippage x2 stress test

# ---------------------------------------------------------------- engine
engine:
  initial_capital: 10000.0
  risk_per_trade: 0.01
  max_leverage: 5.0
  max_positions: 5
  max_positions_per_pair: 1
  maintenance_margin_rate: 0.01  # used for the isolated-margin liquidation price
  min_stop_pct: 0.003            # signal ignored if stop distance < 0.3 % of entry
  max_stop_pct: 0.06             # signal ignored if stop distance > 6 % of entry

# ---------------------------------------------------------------- indicators
indicators:
  atr_period: 14
  rsi_period: 14
  adx_period: 14
  bb_period: 20
  ema_fast: 20
  ema_mid: 50
  ema_slow: 200

# ---------------------------------------------------------------- setup families (closed grids)
families:
  A:
    name: "SMC (sweep + MSS + retour sur zone)"
    fixed:
      pivot_lookback_bars: 50
      equal_level_tol: 0.0015     # 0.15 %
      min_group_size: 2
      mss_window_bars: 10
      displacement_atr_mult: 1.5
      stop_margin_atr: 0.1
      limit_validity_bars: 10
      htf: "4h"
    grid:
      timeframe: ["15m", "1h"]
      pivot_n: [3, 5]
      structure: ["deplacement", "simple"]
      zone: ["FVG", "OB"]
      tp_r: [2, 3]
      htf_filter: ["off", "on"]
  B:
    name: "Continuation de tendance sur repli"
    fixed:
      pullback_window_bars: 5
      rsi_lookback_bars: 5
      pivot_n: 3
      stop_atr_mult: 1.5
      tp_r: 2
      trail_atr_mult: 3.0
    grid:
      timeframe: ["1h", "4h"]
      rsi_thresholds: ["40/60", "45/55"]
      stop: ["atr", "pivot"]
      exit: ["tp2r", "trail"]
  C:
    name: "Cassure de range (Donchian)"
    fixed:
      volume_mult: 1.5
      volume_window_bars: 20
      stop_atr_mult: 2.0
      trail_atr_mult: 3.0
    grid:
      timeframe: ["1h", "4h"]
      donchian_n: [20, 55]
      volume_filter: ["off", "on"]
  D:
    name: "Retour à la moyenne"
    fixed:
      adx_max: 20
      stop_atr_mult: 1.5
      max_hold_bars: 24
    grid:
      timeframe: ["15m", "1h"]
      bb_k: [2.0, 2.5]
      rsi_thresholds: ["25/75", "20/80"]
  E:
    name: "Extrêmes de funding (contrarien)"
    fixed:
      timeframe: "1h"
      z_window: 90
      confirm_window_hours: 8
      stop_atr_mult: 2.0
      tp_r: 2
    grid:
      z: [2, 3]
      max_hold_hours: [24, 48]

# ---------------------------------------------------------------- selection (section 7)
selection:
  dev_min_trades: 100
  dev_min_expectancy_r: 0.0      # strictly greater
  dev_min_profit_factor: 1.0     # strictly greater
  plateau_min_share: 0.5         # at least half of direct neighbours with expectancy > 0

# ---------------------------------------------------------------- verdict (section 9, immutable)
verdict:
  min_trades: 100
  min_expectancy_r: 0.10
  min_profit_factor: 1.15
  ci_level: 0.95
  baseline_percentile: 95
  min_share_pairs_positive: 0.60
  min_trades_per_pair: 10
  max_drawdown_pct: 25.0
  bad_quarter_threshold_r: -0.3
  max_share_bad_quarters: 0.3333333333

# ---------------------------------------------------------------- statistics
stats:
  bootstrap_resamples: 10000
  baseline_simulations: 1000
  baseline_pool_min: 50000       # random entries simulated per configuration (pool)
  baseline_pool_per_trade: 10    # pool size = max(pool_min, per_trade * n_trades), capped
  baseline_pool_max: 300000
